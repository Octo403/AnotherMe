[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aitown"
version = "0.1.0"
description = "AnotherMe single Agent LangGraph experiment"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "faiss-cpu>=1.10,<2",
  "numpy>=2,<3",
  "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
privacy = ["pypinyin>=0.55,<1"]
retrieval = ["torch>=2.6,<3", "transformers>=4.48,<5", "psutil>=6,<8"]
question-bank = ["pymupdf>=1.24,<2"]

[project.scripts]
aitown = "aitown.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aitown"]

[tool.pytest.ini_options]
testpaths = ["tests"]
